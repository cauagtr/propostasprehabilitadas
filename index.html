// Gráfico semanal pela Data de Cadastro (usa os filtros do painel, menos o de data:
// o gráfico já tem a própria janela de semanas)
function renderEvolucao(props) {
  const N = 5
  const segAtual = inicioSemana(new Date())
  const semanas = []
  for (let i = N; i >= 0; i--) {             // N completas + a atual
    const ini = new Date(segAtual); ini.setDate(ini.getDate() - 7*i)
    const fim = new Date(ini); fim.setDate(fim.getDate() + 6)
    semanas.push({
      ini: isoDia(ini), fim: isoDia(fim), atual: i === 0,
      label: `${ini.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} a ${fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`,
      props: [], count: 0, valor: 0
    })
  }
  props.forEach(p => {
    if (!p.data_cadastro) return
    const dt = String(p.data_cadastro).split('T')[0]
    const s = semanas.find(w => dt >= w.ini && dt <= w.fim)
    if (s) { s.props.push(p); s.count++; s.valor += (p.valor||0) }
  })
  evoSemanas = semanas

  const completas = semanas.filter(w => !w.atual)
  const atual = semanas[semanas.length - 1]
  // Regressão linear (mínimos quadrados) nas semanas completas: y = a + b·x
  const n = completas.length
  const xs = completas.map((_, i) => i), ys = completas.map(w => w.count)
  const mx = xs.reduce((s,v)=>s+v,0)/n, my = ys.reduce((s,v)=>s+v,0)/n
  const sxx = xs.reduce((s,x)=>s+(x-mx)**2,0)
  const b = sxx ? xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/sxx : 0
  const a = my - b*mx
  const tendencia = i => Math.max(0, a + b*i)
  const previsao = Math.round(tendencia(n))            // semana atual
  const media = Math.round(my)
  const ultima = completas[n-1] ? completas[n-1].count : 0, penultima = completas[n-2] ? completas[n-2].count : 0
  const variacao = ultima - penultima
  const varPct = penultima ? Math.round((variacao/penultima)*100) : null

  // Desenho
  const L = 44, R = 16, T = 26, B = 46, W = 900, H = 280
  const larg = W - L - R, alt = H - T - B
  const maxV = Math.max(1, ...semanas.map(w => w.count), previsao)
  const slot = larg / semanas.length
  const bw = Math.min(90, slot * 0.58)
  const cx = i => L + slot*i + slot/2
  const py = v => T + alt - (v / maxV) * alt
  const marcas = [...new Set([0, .25, .5, .75, 1].map(f => Math.round(maxV*f)))].map(v => ({ v, y: py(v) }))
  const tx1 = cx(0), tx2 = cx(n)                       // linha vai até a semana atual
  const corTend = b >= 0 ? '#16a34a' : '#dc2626'

  return `
    <div class="painel-secao">
      <div class="painel-secao-titulo">📈 Pré-Propostas Cadastradas por Semana<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Pre-propostas incompletas cadastradas em cada semana (segunda a domingo), pela Data de Cadastro. Mostra as ultimas 5 semanas completas e a semana atual. A linha tracejada e a tendencia por regressao linear, e o tracejado na semana atual e a previsao. Clique numa barra para ver as propostas da semana.">?</span></div>
      <div class="painel-secao-sub">Últimas ${N} semanas completas + semana atual · clique na barra para ver as propostas</div>
      <div class="evo-resumo">
        <div class="evo-resumo-item"><span class="evo-resumo-num">${ultima}</span><span class="evo-resumo-lbl">semana passada</span></div>
        <div class="evo-resumo-item">
          <span class="evo-resumo-num" style="color:${variacao > 0 ? '#16a34a' : variacao < 0 ? '#dc2626' : '#64748b'}">
            ${variacao > 0 ? '▲' : variacao < 0 ? '▼' : '='} ${Math.abs(variacao)}${varPct !== null ? ` (${varPct > 0 ? '+' : ''}${varPct}%)` : ''}
          </span>
          <span class="evo-resumo-lbl">vs. semana anterior</span>
        </div>
        <div class="evo-resumo-item"><span class="evo-resumo-num">${media}</span><span class="evo-resumo-lbl">média por semana (${N} sem.)</span></div>
        <div class="evo-resumo-item"><span class="evo-resumo-num" style="color:${corTend}">${b >= 0 ? '↗' : '↘'} ${b >= 0 ? '+' : ''}${b.toFixed(1)}</span><span class="evo-resumo-lbl">tendência (por semana)</span></div>
        <div class="evo-resumo-item"><span class="evo-resumo-num">${atual.count} <span style="font-size:14px;color:#94a3b8">/ ${previsao}</span></span><span class="evo-resumo-lbl">semana atual / previsão</span></div>
      </div>
      <div class="grafico-wrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="grafico-svg">
          ${marcas.map(m => `
            <line x1="${L}" y1="${m.y.toFixed(1)}" x2="${W-R}" y2="${m.y.toFixed(1)}" class="g-grade"/>
            <text x="${L-8}" y="${(m.y+4).toFixed(1)}" class="g-eixo-y">${m.v}</text>`).join('')}
          ${semanas.map((w, i) => {
            const x = cx(i) - bw/2, y = py(w.count), h = T + alt - y
            const cor = w.atual ? '#93C5FD' : '#2563EB'
            return `<g class="g-barra" style="cursor:pointer" onclick="verPropostasDaSemana(${i})">
              <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="5" fill="${cor}"/>
              <text x="${cx(i).toFixed(1)}" y="${(y-7).toFixed(1)}" class="g-valor" style="font-weight:700">${w.count}</text>
              <text x="${cx(i).toFixed(1)}" y="${H-26}" class="g-eixo-x">${w.label}</text>
              <text x="${cx(i).toFixed(1)}" y="${H-12}" class="g-eixo-x" style="font-weight:600">${w.atual ? 'semana atual' : formatValor(w.valor)}</text>
              <title>${w.label}: ${w.count} proposta${w.count!==1?'s':''} · ${formatValor(w.valor)}</title>
            </g>`
          }).join('')}
          ${(() => { const x = cx(n) - bw/2, y = py(previsao), h = T + alt - y
            return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="5" fill="none" stroke="${corTend}" stroke-width="1.5" stroke-dasharray="5 4"><title>Previsão para a semana atual: ${previsao}</title></rect>` })()}
          <line x1="${tx1.toFixed(1)}" y1="${py(tendencia(0)).toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${py(tendencia(n)).toFixed(1)}" stroke="${corTend}" stroke-width="2" stroke-dasharray="7 5"/>
        </svg>
      </div>
      <div style="font-size:11.5px;color:#64748b;margin-top:6px">
        <span style="display:inline-block;width:10px;height:10px;background:#2563EB;border-radius:2px;vertical-align:middle"></span> semana completa ·
        <span style="display:inline-block;width:10px;height:10px;background:#93C5FD;border-radius:2px;vertical-align:middle"></span> semana atual ·
        <span style="color:${corTend}">- - -</span> tendência e previsão (regressão linear)
      </div>
    </div>`
}

function verPropostasDaSemana(i) {
  const w = evoSemanas[i]
  if (!w) return
  const lista = [...w.props].sort((a,b) => String(a.data_cadastro).localeCompare(String(b.data_cadastro)) || String(a.codigo).localeCompare(String(b.codigo)))
  const diaSemana = v => { const d = new Date(String(v).split('T')[0] + 'T12:00:00'); return d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'}) }
  document.getElementById('ms-titulo').textContent = `Semana de ${w.label}${w.atual ? ' (atual)' : ''}`
  document.getElementById('ms-sub').textContent = `${w.count} proposta${w.count!==1?'s':''} cadastrada${w.count!==1?'s':''} · ${formatValor(w.valor)}`
  document.getElementById('ms-lista').innerHTML = lista.length
    ? `<table class="lista-etapa">
        <thead><tr><th>Dia</th><th>Responsável</th><th>Código</th><th>Cliente</th><th>Linha</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${lista.map(p => `<tr>
          <td style="white-space:nowrap">${diaSemana(p.data_cadastro)}</td>
          <td class="le-resp">${p.responsavel || 'N/A'}</td>
          <td class="le-cod">${p.codigo}</td>
          <td class="le-razao">${esc(p.primeiro_nome) || '—'}</td><td class="le-razao">${esc(p.linha_credito) || '—'}</td>
          <td class="le-valor">${formatValor(p.valor)}</td>
        </tr>`).join('')}</tbody>
      </table>`
    : '<div class="painel-empty">Nenhuma proposta cadastrada nesta semana.</div>'
  document.getElementById('modal-semana').style.display = 'flex'
}

async function carregarEnvios() {
  const el = document.getElementById('view-envios')
  el.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">⏳</div><p>Carregando...</p></div></div>`
  try {
    const envios = await sb('prepropostas_envios?select=*&order=criado_em.desc&limit=50') || []
    if (!envios.length) {
      el.innerHTML = `<div class="card"><div class="painel-vazio">📭 Nenhum envio registrado ainda.</div></div>`
      return
    }
    el.innerHTML = `<div class="card">
      <div class="card-title">🕒 Histórico de Envios</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Arquivo</th><th style="text-align:right">Linhas</th><th style="text-align:right">Novas</th><th style="text-align:right">Atualizadas</th></tr></thead>
          <tbody>${envios.map(e => `<tr>
            <td style="font-size:12.5px">${e.criado_em ? new Date(e.criado_em).toLocaleString('pt-BR') : '—'}</td>
            <td style="font-size:12.5px">${e.arquivo || '—'}</td>
            <td style="text-align:right;font-family:'IBM Plex Mono',monospace">${e.total_linhas ?? 0}</td>
            <td style="text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--success)">${e.novas ?? 0}</td>
            <td style="text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--warn)">${e.atualizadas ?? 0}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`
  } catch(e) {
    el.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Erro: ${e.message}</div></div>`
  }
}

function exportarExcel() {
  const rows = getFiltradas()
  if (!rows.length) return showToast('Nada para exportar', 'error')
  const dados = rows.map(p => ({
    'Código': p.codigo,
    'Responsável': normalizarResponsavel(p.responsavel),
    'Linha de Crédito': p.linha_credito || '',
    'Município': p.municipio || '',
    'Valor': p.valor || 0,
    'Última Comunicação': formatData(p.data_ultima_comunicacao),
    'Dias sem contato': diasDesde(p.data_ultima_comunicacao) ?? '',
    'Motivo Devolução': p.motivo_devolucao || '',
    'Tipo de Mensagem': NOME_TIPO[tipoMensagem(p.motivo_devolucao)] || '',
    'Cliente': p.primeiro_nome || '',
    'Data de Cadastro': formatData(p.data_cadastro),
    'Comentário': p.observacao || '',
  }))
  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dados), 'Pré-Propostas')
  XLSX.writeFile(wb, `prepropostas_${new Date().toISOString().split('T')[0]}.xlsx`)
  showToast(`✓ ${rows.length} linhas exportadas`)
}

function exportarPainelExcel() {
  const wb = XLSX.utils.book_new()
  const grupo = (campo, norm) => {
    const m = {}
    todasPre.forEach(p => {
      const k = norm ? norm(p[campo]) : ((p[campo]||'').trim() || '(não informado)')
      if (!m[k]) m[k] = { qtd: 0, valor: 0 }
      m[k].qtd++; m[k].valor += (p.valor||0)
    })
    return Object.entries(m).sort((a,b)=>b[1].qtd-a[1].qtd).map(([n,d]) => ({ Item: n, Quantidade: d.qtd, Valor: d.valor }))
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grupo('responsavel', v=>normalizarResponsavel(v))), 'Por Responsável')
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grupo('linha_credito')), 'Por Linha')
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grupo('motivo_devolucao')), 'Por Motivo')
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grupo('municipio')), 'Por Município')
  XLSX.writeFile(wb, `painel_prepropostas_${new Date().toISOString().split('T')[0]}.xlsx`)
  showToast('✓ Painel exportado')
}
